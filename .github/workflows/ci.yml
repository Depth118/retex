name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (64-bit app and CLI)
        run: cargo clippy --workspace --release -- -D warnings
      - name: Clippy (32-bit hook and injector)
        run: cargo clippy -p retex-hook -p retex-inject --target i686-pc-windows-msvc --release -- -D warnings
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: retex-windows
          path: dist/*.zip
