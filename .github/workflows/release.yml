name: Release

# Push a tag such as v0.1.0 to build the zip and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add i686-pc-windows-msvc
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts\package.ps1
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --title "Retex $GITHUB_REF_NAME" --generate-notes
