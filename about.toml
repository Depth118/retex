# Third-party license notices for the release zip:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "Bitstream-Vera",
]

# minhook bundles the MinHook C library (BSD-2-Clause), which its crate
# metadata does not declare.
[minhook.clarify]
license = "MIT AND BSD-2-Clause"

[[minhook.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "81053d86dc61a9744c0bab79674e6864ef206c0084caf1cf7f8a9db7c12efd24"

[[minhook.clarify.files]]
path = "minhook/LICENSE.txt"
license = "BSD-2-Clause"
checksum = "4f21f857550d7be854da6ea5f2da4e6775ca4e3fbb535e4f3d961c47d0bf3335"

